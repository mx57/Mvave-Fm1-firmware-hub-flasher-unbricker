    </text>
    <rect x="26" y="114" width="280" height="28" rx="6" fill="#00E5A3" />
    <text x="48" y="132" fill="#041E15" font-family="sans-serif" font-size="11" font-weight="bold">
      1-CLICK STOCK V16 RECOVERY (0x4000)
    </text>

    <!-- Hard-Brick Pinout -->
    <rect x="16" y="164" width="300" height="82" rx="8" fill="#0D0F12" stroke="#38BDF8" />
    <text x="26" y="184" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">
      HARD-BRICK: RP2040 TRANSPORTER WIZARD
    </text>
    <text x="26" y="204" fill="#00E5A3" font-family="monospace" font-size="11">
      GPIO 0 (RP2040) ──► USB D+ (FM-1)
    </text>
    <text x="26" y="220" fill="#00E5A3" font-family="monospace" font-size="11">
      GPIO 1 (RP2040) ──► USB D- (FM-1)
    </text>
    <text x="26" y="236" fill="#94A3B8" font-family="monospace" font-size="10">
      + Desktop Scripts (Win PowerShell / Linux / macOS)
    </text>

    <!-- Live Terminal -->
    <rect x="16" y="258" width="300" height="80" rx="8" fill="#07090D" stroke="#2B3444" />
    <text x="24" y="276" fill="#38BDF8" font-family="monospace" font-size="10">
      [USB_IO] TX SysEx: F0 22 24 35 7D F7
    </text>
    <text x="24" y="294" fill="#00E5A3" font-family="monospace" font-size="10">
      [UBOOT] WL82 UBOOT1.00 Handshake ACK
    </text>
    <text x="24" y="312" fill="#FF6B2B" font-family="monospace" font-size="10">
      [HASH] SHA-256 &amp; CRC32 Read-Back OK
    </text>
    <text x="24" y="328" fill="#94A3B8" font-family="monospace" font-size="10">
      [DONE] Rebooting DSP @ 0x00004000...
    </text>
  </g>
