    </text>

    <!-- 64 Sector Visual Grid -->
    <rect x="16" y="124" width="300" height="92" rx="8" fill="#0D0F12" stroke="#2B3444" />
    <text x="26" y="144" fill="#38BDF8" font-family="monospace" font-size="11">
      ■■■ Boot (1-4)   ■■■■■■■■■■■■ App (5-64)
    </text>
    <g transform="translate(26, 156)">
      <rect x="0" y="0" width="28" height="18" rx="3" fill="#38BDF8" />
      <rect x="34" y="0" width="28" height="18" rx="3" fill="#38BDF8" />
      <rect x="68" y="0" width="28" height="18" rx="3" fill="#38BDF8" />
      <rect x="102" y="0" width="28" height="18" rx="3" fill="#38BDF8" />
      <rect x="136" y="0" width="28" height="18" rx="3" fill="#00E5A3" />
      <rect x="170" y="0" width="28" height="18" rx="3" fill="#00E5A3" />
      <rect x="204" y="0" width="28" height="18" rx="3" fill="#00E5A3" />
      <rect x="238" y="0" width="28" height="18" rx="3" fill="#00E5A3" />

      <rect x="0" y="24" width="28" height="18" rx="3" fill="#00E5A3" />
      <rect x="34" y="24" width="28" height="18" rx="3" fill="#00E5A3" />
      <rect x="68" y="24" width="28" height="18" rx="3" fill="#00E5A3" />
      <rect x="102" y="24" width="28" height="18" rx="3" fill="#FF6B2B" />
      <rect x="136" y="24" width="28" height="18" rx="3" fill="#263040" />
      <rect x="170" y="24" width="28" height="18" rx="3" fill="#263040" />
      <rect x="204" y="24" width="28" height="18" rx="3" fill="#263040" />
      <rect x="238" y="24" width="28" height="18" rx="3" fill="#263040" />
    </g>

    <!-- Checksum Box -->
    <rect x="16" y="228" width="300" height="58" rx="8" fill="#0D0F12" stroke="#00E5A3" />
    <text x="26" y="248" fill="#00E5A3" font-family="monospace" font-size="11" font-weight="bold">
      ✓ INTEGRITY VERIFIED (SHA-256 &amp; CRC32)
    </text>
    <text x="26" y="268" fill="#94A3B8" font-family="monospace" font-size="10">
      Auto-Backup EEPROM + Read-Back Verify ON
    </text>

    <!-- Primary CTA -->
    <rect x="16" y="298" width="300" height="40" rx="8" fill="#FF6B2B" />
    <text x="48" y="323" fill="#140702" font-family="sans-serif" font-size="13" font-weight="bold">
      ⚡ START AUTO-FLASH (0x00004000)
    </text>
  </g>

  <!-- Panel 3: Unbricker & Logs -->
  <g transform="translate(744, 24)">
    <rect x="0" y="0" width="332" height="352" rx="14" fill="#151921" stroke="#2B3444" stroke-width="1.5" />
    <rect x="16" y="16" width="300" height="32" rx="6" fill="#1D232E" />
    <text x="28" y="37" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">
