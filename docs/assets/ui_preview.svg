    </text>

    <!-- Boot Guard Box -->
    <rect x="16" y="60" width="300" height="52" rx="8" fill="#073528" stroke="#00E5A3" />
    <text x="28" y="82" fill="#00E5A3" font-family="monospace" font-size="11" font-weight="bold">
