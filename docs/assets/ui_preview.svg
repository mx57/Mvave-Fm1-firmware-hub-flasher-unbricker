<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="400">
  <rect width="1100" height="400" rx="16" fill="#0D0F12" stroke="#2B3444" stroke-width="2" />

  <!-- Panel 1: Catalog Hub -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="332" height="352" rx="14" fill="#151921" stroke="#2B3444" stroke-width="1.5" />
    <rect x="16" y="16" width="300" height="32" rx="6" fill="#1D232E" />
    <text x="28" y="37" fill="#FF6B2B" font-family="monospace" font-size="13" font-weight="bold">
      1. THEFIRMWAREHUB CATALOG
    </text>

    <!-- Search Box -->
    <rect x="16" y="60" width="300" height="34" rx="8" fill="#0D0F12" stroke="#364154" />
    <text x="28" y="82" fill="#94A3B8" font-family="sans-serif" font-size="12">
      🔍 Search SLOOP, Felucca, SID, Stock V16...
    </text>

    <!-- Card 1 -->
    <rect x="16" y="106" width="300" height="106" rx="10" fill="#1A202C" stroke="#00E5A3" stroke-width="1.5" />
    <text x="28" y="128" fill="#00E5A3" font-family="monospace" font-size="10" font-weight="bold">
      OFFICIAL STOCK / UNBRICK • v1.16
    </text>
    <text x="28" y="150" fill="#F1F5F9" font-family="sans-serif" font-size="15" font-weight="bold">
      M-VAVE FM-1 Stock Recovery
    </text>
    <text x="28" y="172" fill="#94A3B8" font-family="monospace" font-size="11">
      CRC32: Verified • Offset: 0x00004000
    </text>
    <rect x="28" y="182" width="140" height="22" rx="5" fill="#00E5A3" />
    <text x="42" y="197" fill="#051B14" font-family="sans-serif" font-size="11" font-weight="bold">
      Unbrick / Flash
    </text>

    <!-- Card 2 -->
    <rect x="16" y="224" width="300" height="106" rx="10" fill="#1A202C" stroke="#FF6B2B" stroke-width="1.2" />
    <text x="28" y="246" fill="#FF6B2B" font-family="monospace" font-size="10" font-weight="bold">
      GROOVEBOX &amp; SEQUENCER • v2.4.1
    </text>
    <text x="28" y="268" fill="#F1F5F9" font-family="sans-serif" font-size="15" font-weight="bold">
      SLOOP Groovebox Workstation
    </text>
    <text x="28" y="290" fill="#94A3B8" font-family="monospace" font-size="11">
      4-Track Step Seq • P-Locks • MIDI Sync
    </text>
    <rect x="28" y="300" width="140" height="22" rx="5" fill="#FF6B2B" />
    <text x="40" y="315" fill="#140702" font-family="sans-serif" font-size="11" font-weight="bold">
      Select &amp; Flash
    </text>
  </g>

  <!-- Panel 2: 64-Sector USB Flasher -->
  <g transform="translate(384, 24)">
    <rect x="0" y="0" width="332" height="352" rx="14" fill="#151921" stroke="#2B3444" stroke-width="1.5" />
    <rect x="16" y="16" width="300" height="32" rx="6" fill="#1D232E" />
    <text x="28" y="37" fill="#00E5A3" font-family="monospace" font-size="13" font-weight="bold">
