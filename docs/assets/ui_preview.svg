    </text>

    <!-- Soft-Brick Card -->
    <rect x="16" y="60" width="300" height="92" rx="8" fill="#1A202C" stroke="#F59E0B" />
    <text x="26" y="80" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">
      SOFT-BRICK: WL82 UBOOT1.00 (4C4A:8057)
    </text>
    <text x="26" y="100" fill="#F1F5F9" font-family="sans-serif" font-size="12">
